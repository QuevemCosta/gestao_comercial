[package]
name = "gestao_comercial"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
slint = "1.8"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
slint-build = "1.8"
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true